<style>
:root{
  color-scheme:light only;
  --navy:#0E2A44;
  --navy-2:#163A5C;
  --steel:#2C5E88;
  --teal:#217C74;
  --teal-soft:#E3F0EE;
  --slate:#46596C;
  --line:#D8E0E8;
  --bg:#F2F5F8;
  --card:#FFFFFF;
  --soft:#EDF2F6;
  --radius:14px;
  --shadow:0 1px 2px rgba(14,42,68,.06),0 8px 24px rgba(14,42,68,.07);
  --font-sans:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,Arial,sans-serif;
  --font-mono:'IBM Plex Mono','Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--navy);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--font-mono)}
a{color:var(--steel)}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.skip-link{
  position:absolute;top:-48px;inset-inline-start:12px;z-index:99;
  background:var(--navy);color:#fff;padding:8px 16px;border-radius:8px;
  font-size:13.5px;text-decoration:none;transition:top .15s;
}
.skip-link:focus{top:10px}

/* ---------- Topbar / Nav ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1120px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.monogram{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  background:var(--navy);color:#fff;
  display:grid;place-items:center;
  font-family:var(--font-mono);font-weight:600;font-size:14px;letter-spacing:.5px;
}
.brand-name{font-weight:700;font-size:15px;line-height:1.3;white-space:nowrap}
.brand-role{font-size:11.5px;color:var(--slate);line-height:1.35}
.nav-row{display:flex;align-items:center;gap:14px;min-width:0}
.main-nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.main-nav::-webkit-scrollbar{display:none}
.main-nav a{
  color:var(--slate);text-decoration:none;font-size:13.5px;font-weight:600;
  padding:7px 11px;border-radius:8px;white-space:nowrap;transition:background .15s,color .15s;
}
.main-nav a:hover{background:var(--soft);color:var(--navy)}
.lang-toggle{
  display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:#fff;flex-shrink:0;
}
.lang-toggle button{
  border:0;background:transparent;padding:7px 15px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:600;color:var(--slate);
  transition:background .2s,color .2s;
}
.lang-toggle button.active{background:var(--navy);color:#fff}
.menu-btn{
  display:none;border:1px solid var(--line);background:var(--card);border-radius:9px;
  width:42px;height:42px;align-items:center;justify-content:center;cursor:pointer;color:var(--navy);
  flex-shrink:0;
}
.mobile-menu{
  display:none;border-top:1px solid var(--line);background:var(--card);
  box-shadow:0 14px 24px rgba(14,42,68,.10);
}
.mobile-menu.open{display:block}
.mobile-menu div{max-width:1120px;margin:0 auto;padding:6px 14px 12px;display:flex;flex-direction:column}
.mobile-menu a{
  display:block;padding:12px 8px;min-height:44px;color:var(--navy);text-decoration:none;
  font-weight:600;font-size:15px;border-bottom:1px solid var(--bg);
}
.mobile-menu a:last-child{border-bottom:0}
.mobile-menu a:hover{color:var(--steel)}
@media(max-width:900px){
  .menu-btn{display:inline-flex}
  .main-nav a{display:none}
  .main-nav a.nav-core{display:inline-block}
}
@media(max-width:820px){
  .brand-role{display:none}
  .topbar-inner{padding:8px 14px}
}
@media(max-width:560px){
  .main-nav a.nav-core{display:none}
  .main-nav{display:none}
}

.toast{
  position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%) translateY(16px);
  background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;box-shadow:0 10px 26px rgba(14,42,68,.3);
}
html[dir="rtl"] .toast{transform:translateX(50%) translateY(16px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
html[dir="rtl"] .toast.show{transform:translateX(50%) translateY(0)}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#FFFFFF 0%,var(--bg) 100%);border-bottom:1px solid var(--line)}
.hero-inner{max-width:1120px;margin:0 auto;padding:64px 20px 48px;position:relative;z-index:1}
.hero-svg{
  position:absolute;inset-block:0;inset-inline-end:-40px;width:560px;max-width:60%;
  opacity:.5;pointer-events:none;z-index:0;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:600;letter-spacing:1px;
  color:var(--teal);text-transform:uppercase;margin-bottom:16px;
}
html[dir="rtl"] .eyebrow{letter-spacing:0}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--teal);border-radius:2px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:700;line-height:1.3;color:var(--navy)}
.hero .role{font-size:clamp(15px,2.3vw,19.5px);color:var(--steel);font-weight:600;margin-top:10px;max-width:640px}
.hero .summary{max-width:620px;color:var(--slate);margin-top:16px;font-size:15.5px}
.hero-meta{display:flex;align-items:center;gap:8px;color:var(--slate);font-size:13.5px;margin-top:16px;font-weight:500}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;
  text-decoration:none;cursor:pointer;border:1px solid transparent;
  font-family:inherit;transition:background .15s,border-color .15s,color .15s;
}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-outline{background:#fff;color:var(--navy);border-color:var(--line)}
.btn-outline:hover{border-color:var(--steel);color:var(--steel)}
.btn-ghost2{border:1px dashed var(--line);color:var(--slate);background:transparent}
.btn-ghost2:hover{border-color:var(--steel);color:var(--steel)}
html[dir="rtl"] .act-projects{order:1}
html[dir="rtl"] .act-cv-ar{order:2}
html[dir="rtl"] .act-save{order:3}
html[dir="rtl"] .act-share{order:4}
html[dir="rtl"] .act-cv-en{order:5}
html[dir="rtl"] .btn-ghost2{order:5}
@media(max-width:560px){
  .hero-inner{padding:30px 16px 26px}
  .hero .summary{
    font-size:14.5px;margin-top:12px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
  .hero-actions .act-projects{grid-column:1/-1}
  .hero-actions .btn{min-height:46px;justify-content:center;text-align:center;font-size:13.8px;padding:10px 10px}
  .hero-svg{opacity:.5;inset-inline-end:-120px}
  h1{font-size:30px}
  .hero .role{font-size:14px}
}

/* ---------- Proof strip ---------- */
.proof{max-width:1120px;margin:0 auto;padding:28px 20px 6px}
.proof-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.proof-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.proof-item{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;justify-content:center;min-height:74px;
}
@media(max-width:560px){
  .proof{padding:18px 16px 4px}
  .proof-item{padding:11px 12px;min-height:64px}
  .proof-num{font-size:16px}
  .proof-label{font-size:11.6px}
}
.proof-num{font-family:var(--font-mono);font-weight:600;font-size:19px;color:var(--navy);line-height:1.3}
.proof-label{font-size:12.8px;color:var(--slate);margin-top:3px;font-weight:500}
.proof-note{font-size:12.2px;color:var(--slate);margin-top:12px;display:flex;gap:7px;align-items:flex-start;opacity:.9}
.proof-note svg{flex-shrink:0;margin-top:3px}

/* ---------- Sections ---------- */
main{display:block}
.section{max-width:1120px;margin:0 auto;padding:52px 20px 8px}
.section-head{margin-bottom:22px}
.section-head h2{font-size:clamp(21px,3vw,27px);font-weight:700;color:var(--navy)}
.section-sub{color:var(--slate);font-size:14.5px;margin-top:5px;max-width:640px}

/* ---------- Project cards ---------- */
.flagship{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:28px;margin-bottom:20px;
  border-inline-start:4px solid var(--teal);
}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card-tag{
  font-size:12px;font-weight:700;color:var(--steel);
  background:#EAF1F7;border-radius:7px;padding:4px 11px;
}
.card-status{
  font-size:12px;font-weight:700;color:var(--teal);
  background:var(--teal-soft);border-radius:7px;padding:4px 11px;
}
.flagship-badge{
  font-size:11.5px;font-weight:700;color:#fff;background:var(--teal);
  border-radius:7px;padding:4px 11px;letter-spacing:.4px;
}
html[dir="rtl"] .flagship-badge{letter-spacing:0}
.flagship h3,.pcard h3{font-size:19px;font-weight:700;line-height:1.45;color:var(--navy)}
.flagship h3{font-size:22px}
.flagship .p-sum,.pcard .p-sum{color:var(--slate);font-size:14.5px;margin-top:8px}
.flagship .p-sum{max-width:760px}
.p-role{
  margin-top:14px;background:var(--soft);border-radius:10px;padding:12px 16px;
  font-size:13.8px;color:var(--navy-2);
}
.p-role b{color:var(--teal);font-size:12px;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:2px}
html[dir="rtl"] .p-role b{letter-spacing:0}
.metric{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;
  font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--navy-2);
  background:var(--soft);border:1px dashed #B9C6D3;border-radius:9px;padding:7px 13px;
}
.card-open{
  display:inline-flex;align-items:center;gap:6px;margin-top:16px;
  color:var(--steel);font-weight:700;font-size:14px;
}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.pcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px;text-align:start;cursor:pointer;
  font-family:inherit;color:inherit;display:flex;flex-direction:column;align-items:flex-start;
  transition:border-color .15s,transform .15s;width:100%;
}
.pcard:hover,.flagship:hover{border-color:var(--steel)}
.pcard:hover{transform:translateY(-2px)}
.project-card{cursor:pointer}
.open-case-study{
  display:inline-flex;align-items:center;gap:6px;margin-top:16px;min-height:44px;
  border:0;background:transparent;padding:4px 0;cursor:pointer;font-family:inherit;
  color:var(--steel);font-weight:700;font-size:14px;
}
.open-case-study:hover{color:var(--navy)}
.open-case-study:focus-visible,.btn:focus-visible,.menu-btn:focus-visible,.lang-toggle button:focus-visible{
  outline:2.5px solid var(--teal);outline-offset:3px;border-radius:6px;
}
.pcard h3{font-size:16.5px;margin-top:2px}

/* ---------- Coded visuals ---------- */
.viz{margin-top:18px;width:100%}
.viz-frame{
  background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:16px;position:relative;
}
.viz-badge{
  position:absolute;top:10px;inset-inline-end:12px;
  font-size:10.5px;font-weight:700;color:var(--slate);
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 8px;
}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:6px}
.flow-step{
  background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:6px 11px;font-size:12.3px;font-weight:600;color:var(--navy-2);white-space:nowrap;
}
.flow-step.gate{
  background:var(--teal);border-color:var(--teal);color:#fff;
  position:relative;
}
.flow-arrow{color:#93A6B8;font-size:13px;flex-shrink:0}
.flow-branch{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.branch-chip{
  font-size:11.8px;font-weight:700;border-radius:99px;padding:4px 13px;
  background:var(--teal-soft);color:var(--teal);border:1px solid #BBD9D5;
}
.branch-lbl{font-size:11.8px;color:var(--slate);font-weight:600}
@media(max-width:560px){
  .flow{flex-direction:column;align-items:stretch}
  .flow-step{white-space:normal;text-align:center}
  .flow-arrow{align-self:center;transform:rotate(90deg)}
  html[dir="rtl"] .flow-arrow{transform:rotate(-90deg)}
}
/* mini dashboard */
.mini-dash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
@media(max-width:560px){.mini-dash{grid-template-columns:repeat(2,1fr)}}
.md-tile{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.md-lbl{font-size:10.3px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.3px;line-height:1.4}
html[dir="rtl"] .md-lbl{letter-spacing:0}
.md-val{font-family:var(--font-mono);font-size:13.5px;font-weight:600;color:var(--navy);margin-top:2px}
.md-bar{display:flex;gap:3px;align-items:flex-end;height:26px;margin-top:6px}
.md-bar i{flex:1;background:var(--steel);border-radius:2px 2px 0 0;opacity:.75;min-width:4px}
.md-bar i.warn{background:var(--teal)}
.md-track{height:7px;background:var(--soft);border-radius:99px;margin-top:8px;overflow:hidden}
.md-fill{height:100%;background:var(--teal);border-radius:99px}
/* comparison */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media(max-width:560px){.cmp{grid-template-columns:1fr}}
.cmp-col{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.cmp-col h5{font-size:12.3px;font-weight:700;color:var(--navy);margin-bottom:6px}
.cmp-col ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.cmp-col li{font-size:11.8px;color:var(--slate);font-weight:500;display:flex;gap:6px;align-items:center}
.cmp-col li::before{content:"";width:5px;height:5px;border-radius:2px;background:var(--steel);flex-shrink:0}
.cmp-banner{
  grid-column:1/-1;text-align:center;font-size:11.8px;font-weight:700;color:var(--teal);
  background:var(--teal-soft);border:1px dashed #9CC9C3;border-radius:8px;padding:6px 10px;
}
@media(max-width:560px){.cmp-banner{grid-column:auto}}

/* ---------- Method ---------- */
.method-flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.method-step{
  flex:1;min-width:170px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:18px;box-shadow:var(--shadow);
}
.method-idx{
  width:30px;height:30px;border-radius:9px;background:var(--teal-soft);color:var(--teal);
  display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:13px;margin-bottom:10px;
}
.method-step h3{font-size:15.5px;font-weight:700;color:var(--navy)}
.method-step p{font-size:13.2px;color:var(--slate);margin-top:5px}
.method-arrow{align-self:center;color:#93A6B8;font-size:17px;flex-shrink:0}
@media(max-width:900px){
  .method-flow{flex-direction:column}
  .method-step{min-width:0}
  .method-arrow{transform:rotate(90deg)}
  html[dir="rtl"] .method-arrow{transform:rotate(-90deg)}
}

/* ---------- Experience ---------- */
.journey{display:flex;flex-direction:column;gap:14px}
.journey-item{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:20px 24px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:170px 1fr;gap:18px;
}
.journey-period{font-family:var(--font-mono);font-size:12.8px;font-weight:600;color:var(--teal);padding-top:3px}
.journey-body h3{font-size:16.5px;font-weight:700;color:var(--navy)}
.journey-org{font-size:13.5px;color:var(--steel);font-weight:600;margin-top:2px}
.journey-body ul{padding-inline-start:18px;margin-top:8px;display:flex;flex-direction:column;gap:5px}
.journey-body li{font-size:13.8px;color:var(--slate)}
@media(max-width:560px){
  .journey-item{grid-template-columns:1fr;gap:6px;padding:18px}
}

/* ---------- Skills ---------- */
.skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.skills-grid{grid-template-columns:1fr}}
.skill-card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:20px;box-shadow:var(--shadow);
}
.skill-card h3{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.skill-card h3::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  background:var(--soft);color:var(--navy-2);border-radius:7px;
  padding:5px 12px;font-size:12.8px;font-weight:600;
}

/* ---------- Education ---------- */
.edu-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.edu-grid{grid-template-columns:1fr}}
.edu-card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:20px 24px;box-shadow:var(--shadow);
}
.edu-card h3{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:10px}
.edu-card p,.edu-card li{font-size:13.8px;color:var(--slate)}
.edu-card ul{padding-inline-start:18px;display:flex;flex-direction:column;gap:5px}
.edu-degree{font-weight:700;color:var(--navy-2)}

/* ---------- Contact ---------- */
.contact-card{
  background:var(--navy);border-radius:var(--radius);color:#fff;
  padding:36px 30px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;
}
.contact-card h2{font-size:clamp(20px,3vw,26px)}
.contact-card p{color:#C6D4E1;font-size:14.5px;max-width:560px}

.btn-light{background:#fff;color:var(--navy)}

.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}

.contact-meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:13.2px;color:#AFC2D3}
.contact-meta span{display:inline-flex;align-items:center;gap:6px}

/* ---------- Footer ---------- */
.conf-final{
  max-width:1120px;margin:36px auto 0;padding:0 20px;
}
.conf-final-inner{
  background:var(--soft);border:1px solid var(--line);border-radius:12px;
  padding:16px 20px;font-size:12.8px;color:var(--slate);display:flex;gap:10px;align-items:flex-start;
}
.conf-final-inner svg{flex-shrink:0;margin-top:3px}
footer{border-top:1px solid var(--line);margin-top:28px;background:#fff}
.footer-inner{
  max-width:1120px;margin:0 auto;padding:20px;
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-size:13px;color:var(--slate);
}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(14,42,68,.5);z-index:100;
  display:none;align-items:flex-start;justify-content:center;
  padding:4vh 16px;overflow-y:auto;
}
.overlay.open{display:flex}
.modal{
  background:#fff;border-radius:16px;max-width:820px;width:100%;
  box-shadow:0 24px 64px rgba(14,42,68,.28);
}
.modal-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  padding:24px 26px 8px;position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;
  border-bottom:1px solid var(--soft);z-index:2;
}
.modal-head h2{font-size:19px;font-weight:700;line-height:1.45;margin-top:8px;color:var(--navy)}
.close-btn{
  border:1px solid var(--line);background:#fff;border-radius:9px;
  width:36px;height:36px;font-size:15px;cursor:pointer;color:var(--slate);flex-shrink:0;
  font-family:inherit;
}
.close-btn:hover{border-color:var(--steel);color:var(--steel)}
.modal-body{padding:8px 26px 28px}
.block{padding:16px 0;border-bottom:1px solid var(--soft)}
.block:last-child{border-bottom:0}
.block h3{
  font-size:12px;font-weight:700;letter-spacing:.9px;color:var(--steel);
  text-transform:uppercase;margin-bottom:7px;
  display:flex;align-items:center;gap:8px;
}
html[dir="rtl"] .block h3{letter-spacing:0}
.block h3::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--teal)}
.block p{font-size:14.3px;color:#33455A}
.block ul{padding-inline-start:20px;font-size:14.3px;color:#33455A;display:flex;flex-direction:column;gap:6px}
.findings-grid{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:560px){.findings-grid{grid-template-columns:1fr 1fr}}
.finding{
  background:var(--soft);border:1px dashed #B9C6D3;border-radius:10px;
  padding:11px 14px;font-size:13.3px;font-weight:500;color:var(--navy-2);
  display:flex;gap:9px;align-items:flex-start;
}
.finding svg{flex-shrink:0;margin-top:3px}
.conf-mini{font-size:12.3px;color:var(--slate);display:flex;gap:8px;align-items:flex-start}
.conf-mini svg{flex-shrink:0;margin-top:3px}
@media(max-width:560px){
  .modal-head{padding:18px 16px 6px}
  .modal-body{padding:6px 16px 20px}
  .flagship{padding:20px 16px}
}

/* ---------- Print ---------- */
@media print{
  .topbar,.hero-actions,.card-open,.open-case-study,.overlay,.lang-toggle,.contact-actions,.skip-link,.menu-btn,.mobile-menu,.toast{display:none!important}
  body{background:#fff}
  .flagship,.pcard,.proof-item,.method-step,.journey-item,.skill-card,.edu-card{box-shadow:none}
}

<script>
"use strict";

/* ---------- Language state ---------- */
let lang = 'ar';
try {
  const saved = localStorage.getItem('az-portfolio-lang');
  if (saved === 'ar' || saved === 'en') lang = saved;
} catch(e){ /* storage unavailable — keep default */ }

const lockIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
const checkIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#217C74" stroke-width="2.5" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Per-project coded visuals ---------- */
const vizLabels = {
  scrFlow:{
    ar:["الطلب","الاستلام والفرز","التقييم","بوابة قرار التوريد","التخصيص / التعاقد","التسليم","تأكيد استلام المشروع","الإغلاق"],
    en:["Request","Intake","Assessment","Sourcing Gate","Allocation / Contracting","Delivery","Project Receipt Confirmation","Closure"]
  },
  scrBranch:{ar:{lbl:"مسارا التلبية:",a:"توفير داخلي In-source",b:"استئجار خارجي Out-source"},en:{lbl:"Fulfillment paths:",a:"In-source",b:"Out-source"}},
  dash:{
    ar:{status:"حالة العقود",active:"نشط · قرب الانتهاء · منتهٍ",expiry:"توزيع الانتهاء",addendum:"نشاط الملاحق",dq:"مؤشر جودة البيانات",masked:"مموّه — نسخة عامة",portfolio:"توزيع المحفظة",refresh:"يُحدَّث مع كل تحديث للبيانات"},
    en:{status:"Contract Status",active:"Active · Near expiry · Expired",expiry:"Expiry Distribution",addendum:"Addendum Activity",dq:"Data Quality Indicator",masked:"Masked — public view",portfolio:"Portfolio Breakdown",refresh:"Updated with each data refresh"}
  },
  cmp:{
    ar:{a:"الاستئجار — التعرض المتكرر",aItems:["إنفاق إيجاري متكرر","مرونة تعاقدية","اعتماد على التوافر الخارجي"],b:"التملك — الاعتبارات",bItems:["كلفة التملك والصيانة","الاستخدام الفعلي","التوافر والقيمة المتبقية"],banner:"يتطلب تحققًا ماليًا وتشغيليًا نهائيًا"},
    en:{a:"Rent — Recurring Exposure",aItems:["Recurring rental spend","Contractual flexibility","Dependence on external availability"],b:"Own — Considerations",bItems:["Ownership & maintenance cost","Actual utilization","Availability & residual value"],banner:"Final financial & operational validation required"}
  },
  pipe:{
    ar:["مستخرجات Oracle","التحقق من البنية","التنظيف والتوحيد","فحوصات الجودة","بيانات مجهزة","Power BI"],
    en:["Oracle Exports","Structure Validation","Cleaning & Standardization","Quality Checks","Prepared Dataset","Power BI"]
  }
};

function arrowSpan(){ return `<span class="flow-arrow" aria-hidden="true">${lang==='ar'?'←':'→'}</span>`; }

function vizFor(p){
  const badge = `<span class="viz-badge">${esc(ui[lang].anonBadge)}</span>`;
  if (p.id === 'scr'){
    const steps = vizLabels.scrFlow[lang].map((s,i)=>`<span class="flow-step${i===3?' gate':''}">${esc(s)}</span>`).join(arrowSpan());
    const b = vizLabels.scrBranch[lang];
    return `<div class="viz"><div class="viz-frame">${badge}
      <div class="flow">${steps}</div>
      <div class="flow-branch"><span class="branch-lbl">${esc(b.lbl)}</span><span class="branch-chip">${esc(b.a)}</span><span class="branch-chip">${esc(b.b)}</span></div>
    </div></div>`;
  }
  if (p.id === 'contracts'){
    const d = vizLabels.dash[lang];
    return `<div class="viz"><div class="viz-frame">${badge}
      <div class="mini-dash">
        <div class="md-tile"><div class="md-lbl">${esc(d.status)}</div><div class="md-val">▮▮▮▮▯</div><div class="md-lbl" style="text-transform:none;margin-top:3px">${esc(d.active)}</div></div>
        <div class="md-tile"><div class="md-lbl">${esc(d.expiry)}</div><div class="md-bar"><i style="height:35%"></i><i style="height:55%"></i><i style="height:80%" class="warn"></i><i style="height:45%"></i><i style="height:65%"></i><i style="height:30%"></i></div></div>
        <div class="md-tile"><div class="md-lbl">${esc(d.addendum)}</div><div class="md-bar"><i style="height:30%" class="warn"></i><i style="height:50%" class="warn"></i><i style="height:75%" class="warn"></i><i style="height:90%" class="warn"></i></div></div>
        <div class="md-tile"><div class="md-lbl">${esc(d.dq)}</div><div class="md-track"><span class="md-fill" style="display:block;width:72%"></span></div><div class="md-lbl" style="text-transform:none;margin-top:5px">${esc(d.masked)}</div></div>
        <div class="md-tile" style="grid-column:span 2"><div class="md-lbl">${esc(d.portfolio)}</div><div class="md-bar"><i style="height:85%"></i><i style="height:60%"></i><i style="height:48%"></i><i style="height:40%"></i><i style="height:26%"></i><i style="height:20%"></i><i style="height:14%"></i></div></div>
      </div>
      <div class="md-lbl" style="margin-top:9px;text-transform:none">${esc(d.refresh)}</div>
    </div></div>`;
  }
  if (p.id === 'rent-vs-own'){
    const c = vizLabels.cmp[lang];
    return `<div class="viz"><div class="viz-frame">${badge}
      <div class="cmp">
        <div class="cmp-col"><h5>${esc(c.a)}</h5><ul>${c.aItems.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
        <div class="cmp-col"><h5>${esc(c.b)}</h5><ul>${c.bItems.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
        <div class="cmp-banner">${esc(c.banner)}</div>
      </div>
    </div></div>`;
  }
  if (p.id === 'oracle'){
    const steps = vizLabels.pipe[lang].map(s=>`<span class="flow-step">${esc(s)}</span>`).join(arrowSpan());
    return `<div class="viz"><div class="viz-frame">${badge}<div class="flow">${steps}</div></div></div>`;
  }
  return '';
}

/* ---------- Render ---------- */
function render(){
  const t = ui[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.title = t.pageTitle;
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', t.metaDesc);
  document.getElementById('btn-ar').classList.toggle('active', lang==='ar');
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.getElementById('btn-ar').setAttribute('aria-pressed', lang==='ar');
  document.getElementById('btn-en').setAttribute('aria-pressed', lang==='en');
  document.getElementById('modalClose').setAttribute('aria-label', t.close);

  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t[el.dataset.i18n] || ''; });

  const nav = document.getElementById('mainNav');
  nav.setAttribute('aria-label', t.navAria);
  const coreNav = ['projects','experience','contact'];
  nav.innerHTML = Object.entries(t.nav).map(([k,v])=>`<a href="#${k}"${coreNav.includes(k)?' class="nav-core"':''}>${esc(v)}</a>`).join('');
  const mm = document.getElementById('mobileMenuList');
  if (mm) mm.innerHTML = Object.entries(t.nav).map(([k,v])=>`<a href="#${k}">${esc(v)}</a>`).join('');
  const mb = document.getElementById('menuBtn');
  if (mb) mb.setAttribute('aria-label', t.menuOpen);

  document.getElementById('proofGrid').innerHTML = proof.map(p=>`
    <div class="proof-item"><div class="proof-num">${esc(p.num[lang])}</div><div class="proof-label">${esc(p.label[lang])}</div></div>
  `).join('');

  const arrow = lang==='ar' ? '←' : '→';
  const fp = projects.find(p=>p.flagship);
  document.getElementById('flagshipWrap').innerHTML = `
    <article class="flagship project-card" data-card="${fp.id}">
      <div class="card-top">
        <span class="flagship-badge">${esc(t.flagship)}</span>
        <span class="card-tag">${esc(fp.tag[lang])}</span>
        <span class="card-status">${esc(fp.status[lang])}</span>
      </div>
      <h3>${esc(fp.title[lang])}</h3>
      <p class="p-sum">${esc(fp.summary[lang])}</p>
      ${vizFor(fp)}
      <div class="p-role"><b>${esc(t.myRole)}</b>${esc(fp.role[lang])}</div>
      <span class="metric">${lockIcon}<span>${esc(fp.metric[lang])}</span></span>
      <button type="button" class="open-case-study" data-project="${fp.id}" id="card-${fp.id}"
        aria-haspopup="dialog" aria-controls="modalRoot" aria-expanded="false">${esc(t.open)} ${arrow}</button>
    </article>`;

  document.getElementById('projectGrid').innerHTML = projects.filter(p=>!p.flagship).map(p=>`
    <article class="pcard project-card" data-card="${p.id}">
      <div class="card-top"><span class="card-tag">${esc(p.tag[lang])}</span><span class="card-status">${esc(p.status[lang])}</span></div>
      <h3>${esc(p.title[lang])}</h3>
      <p class="p-sum">${esc(p.summary[lang])}</p>
      ${vizFor(p)}
      <div class="p-role"><b>${esc(t.myRole)}</b>${esc(p.role[lang])}</div>
      <span class="metric">${lockIcon}<span>${esc(p.metric[lang])}</span></span>
      <button type="button" class="open-case-study" data-project="${p.id}" id="card-${p.id}"
        aria-haspopup="dialog" aria-controls="modalRoot" aria-expanded="false">${esc(t.open)} ${arrow}</button>
    </article>
  `).join('');

  document.getElementById('methodWrap').innerHTML = methodology.map((m,i)=>`
    <div class="method-step"><div class="method-idx" aria-hidden="true">${i+1}</div><h3>${esc(m.t[lang])}</h3><p>${esc(m.d[lang])}</p></div>
  `).join(`<span class="method-arrow" aria-hidden="true">${lang==='ar'?'←':'→'}</span>`);

  document.getElementById('journeyWrap').innerHTML = journey.map(j=>`
    <article class="journey-item">
      <div class="journey-period">${esc(j.period[lang])}</div>
      <div class="journey-body">
        <h3>${esc(j.t[lang])}</h3>
        <div class="journey-org">${esc(j.org[lang])}</div>
        <ul>${j.d[lang].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      </div>
    </article>
  `).join('');

  document.getElementById('skillsWrap').innerHTML = skillGroups.map(g=>`
    <div class="skill-card"><h3>${esc(g.t[lang])}</h3><div class="chips">${g.items[lang].map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>
  `).join('');

  document.getElementById('eduWrap').innerHTML = `
    <div class="edu-card"><h3>${esc(education.degree.t[lang])}</h3><p class="edu-degree">${esc(education.degree.body[lang])}</p></div>
    <div class="edu-card"><h3>${esc(education.certs.t[lang])}</h3><ul>${education.certs.items[lang].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;

  document.querySelectorAll('.open-case-study').forEach(btn=>{
    btn.addEventListener('click', e=>{ e.stopPropagation(); openModal(btn.dataset.project); });
  });
  document.querySelectorAll('.project-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      if (window.getSelection && String(window.getSelection())) return;
      openModal(card.dataset.card);
    });
  });

  if (modalOpenId) fillModal(modalOpenId);
}

/* ---------- Modal + focus trap + hash routing ---------- */
let modalOpenId = null;
let lastTrigger = null;
const overlay = document.getElementById('overlay');
const modalRoot = document.getElementById('modalRoot');

function fillModal(id){
  const p = projects.find(x=>x.id===id);
  if (!p) return;
  const L = ui[lang].labels;
  document.getElementById('modalTag').textContent = p.tag[lang];
  document.getElementById('modalStatus').textContent = p.status[lang];
  document.getElementById('modalTitle').textContent = p.title[lang];
  document.getElementById('modalBody').innerHTML = `
    <div class="block"><h3>${esc(L.context)}</h3><p>${esc(p.context[lang])}</p></div>
    <div class="block"><h3>${esc(L.challenge)}</h3><p>${esc(p.challenge[lang])}</p></div>
    <div class="block"><h3>${esc(L.role)}</h3><p>${esc(p.role[lang])}</p></div>
    <div class="block"><h3>${esc(L.scope)}</h3><ul>${p.scope[lang].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="block"><h3>${esc(L.approach)}</h3><ul>${p.approach[lang].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="block"><h3>${esc(L.findings)}</h3><div class="findings-grid">${p.findings[lang].map(x=>`<div class="finding">${checkIcon}<span>${esc(x)}</span></div>`).join('')}</div></div>
    <div class="block"><h3>${esc(L.solution)}</h3><p>${esc(p.solution[lang])}</p></div>
    <div class="block"><h3>${esc(L.tools)}</h3><div class="chips">${p.tools[lang].map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>
    <div class="block"><h3>${esc(L.deliverables)}</h3><p>${esc(p.deliverables[lang])}</p></div>
    <div class="block"><h3>${esc(L.outcome)}</h3><p>${esc(p.outcome[lang])}</p></div>
    <div class="block"><p class="conf-mini">${lockIcon}<span>${esc(p.conf[lang])}</span></p></div>`;
}

function openModal(id, fromHash){
  const p = projects.find(x=>x.id===id);
  if (!p) return;
  lastTrigger = document.getElementById('card-'+id) || null;
  modalOpenId = id;
  fillModal(id);
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  if (lastTrigger) lastTrigger.setAttribute('aria-expanded','true');
  document.querySelectorAll('body > header, body > main, body > footer').forEach(el=>{
    if ('inert' in el) el.inert = true; else el.setAttribute('aria-hidden','true');
  });
  if (!fromHash){
    try { history.replaceState(null, '', '#'+id); } catch(e){}
  }
  document.getElementById('modalClose').focus();
}

function closeModal(){
  if (!modalOpenId) return;
  modalOpenId = null;
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  document.querySelectorAll('body > header, body > main, body > footer').forEach(el=>{
    if ('inert' in el) el.inert = false; else el.removeAttribute('aria-hidden');
  });
  document.querySelectorAll('.open-case-study[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
  try {
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  } catch(e){}
  if (lastTrigger) { lastTrigger.focus(); lastTrigger = null; }
}

document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', e=>{ if (e.target === overlay) closeModal(); });

document.addEventListener('keydown', e=>{
  if (!modalOpenId) return;
  if (e.key === 'Escape'){ closeModal(); return; }
  if (e.key === 'Tab'){
    const focusables = modalRoot.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length-1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

function handleHash(){
  const id = location.hash.replace('#','');
  if (projects.some(p=>p.id===id)) openModal(id, true);
}
window.addEventListener('hashchange', handleHash);

/* ---------- Language toggle ---------- */
function setLang(l){
  lang = l;
  try { localStorage.setItem('az-portfolio-lang', l); } catch(e){}
  render();
}
document.getElementById('btn-ar').addEventListener('click', ()=>setLang('ar'));
document.getElementById('btn-en').addEventListener('click', ()=>setLang('en'));

/* ---------- Mobile menu ---------- */
const menuBtn = document.getElementById('menuBtn');
const mobileMenu = document.getElementById('mobileMenu');
function setMenu(open){
  mobileMenu.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
  menuBtn.setAttribute('aria-label', open ? ui[lang].menuClose : ui[lang].menuOpen);
  if (open) mobileMenu.querySelector('a')?.focus();
}
menuBtn.addEventListener('click', ()=> setMenu(!mobileMenu.classList.contains('open')));
mobileMenu.addEventListener('click', e=>{ if (e.target.closest('a')) setMenu(false); });
document.addEventListener('keydown', e=>{
  if (e.key === 'Escape' && mobileMenu.classList.contains('open') && !modalOpenId){ setMenu(false); menuBtn.focus(); }
});
document.addEventListener('click', e=>{
  if (mobileMenu.classList.contains('open') && !e.target.closest('#mobileMenu') && !e.target.closest('#menuBtn')) setMenu(false);
});

/* ---------- Share portfolio (Web Share API + clipboard fallback) ---------- */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
async function sharePortfolio(){
  const url = location.origin.startsWith('http') ? (location.origin + location.pathname) : location.href;
  const payload = { title: ui[lang].name + ' — ' + ui[lang].unifiedTitle, text: ui[lang].name + ' — ' + ui[lang].unifiedTitle, url };
  if (navigator.share){

      const ta = document.createElement('textarea');
      ta.value = url; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }

}
