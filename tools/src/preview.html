<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@page{size:1200px 630px;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0E2A44;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:#fff;position:relative;overflow:hidden}
.grid-lines{position:absolute;inset:0;opacity:.07}
.mono{width:96px;height:96px;border:2.5px solid #217C74;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;letter-spacing:1px;color:#fff;background:rgba(33,124,116,.14)}
.wrap{position:relative;padding:84px 90px;display:flex;flex-direction:column;height:100%}
h1{font-size:64px;font-weight:700;margin-top:44px;letter-spacing:.5px}
.t1{font-size:30px;font-weight:600;color:#9FC1DC;margin-top:20px}
.t2{font-size:30px;font-weight:600;color:#6FBAB2;margin-top:6px}
.loc{margin-top:auto;font-size:23px;color:#B9C6D3;display:flex;align-items:center;gap:12px}
.dot{width:9px;height:9px;border-radius:50%;background:#217C74}
svg.bg{position:absolute;right:-40px;bottom:-30px;opacity:.10}
</style></head><body>
<svg class="bg" width="620" height="480" viewBox="0 0 620 480" fill="none">
  <path d="M40 120 C 180 120, 200 260, 340 260 S 520 360, 610 360" stroke="#9FC1DC" stroke-width="3"/>
  <circle cx="40" cy="120" r="10" fill="#9FC1DC"/><circle cx="340" cy="260" r="10" fill="#6FBAB2"/><circle cx="610" cy="360" r="10" fill="#9FC1DC"/>
  <rect x="470" y="100" width="22" height="90" rx="4" fill="#9FC1DC"/><rect x="502" y="70" width="22" height="120" rx="4" fill="#9FC1DC" opacity=".7"/><rect x="534" y="130" width="22" height="60" rx="4" fill="#6FBAB2"/>
  <rect x="325" y="245" width="30" height="30" rx="5" transform="rotate(45 340 260)" stroke="#6FBAB2" stroke-width="3"/>
</svg>
<div class="wrap">
  <div class="mono">AZ</div>
  <h1>Ahmed Alzahrani</h1>
  <div class="t1">Industrial Engineer</div>
  <div class="t2">Automation &amp; Digital Transformation</div>
  <div class="loc"><span class="dot"></span> Jeddah, Saudi Arabia</div>
</div>
</body></html>
