<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@page{size:1080px 1920px;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0E2A44;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;text-align:center;padding:130px 90px 110px}
.mono{width:120px;height:120px;border:3px solid #217C74;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;background:rgba(33,124,116,.14)}
h1{font-size:72px;font-weight:700;margin-top:64px}
.t1{font-size:40px;font-weight:600;color:#9FC1DC;margin-top:26px}
.t2{font-size:40px;font-weight:600;color:#6FBAB2;margin-top:8px}
.loc{font-size:30px;color:#B9C6D3;margin-top:30px}
.qrbox{margin-top:auto;background:#fff;border-radius:34px;padding:44px}
.qrbox img{width:520px;height:520px;display:block}
.scan{font-size:30px;color:#E8EEF3;margin-top:44px;max-width:760px;line-height:1.5}
.url{font-size:24px;color:#9FC1DC;margin-top:18px;direction:ltr}
</style></head><body>
<div class="mono">AZ</div>
<h1>Ahmed Alzahrani</h1>
<div class="t1">Industrial Engineer</div>
<div class="t2">Automation &amp; Digital Transformation</div>
<div class="loc">Jeddah, Saudi Arabia</div>
<div class="qrbox"><img src="data:image/png;base64,__QR_B64__" alt=""></div>
<div class="scan">Scan to view selected case studies and CV</div>
<div class="url">__URL__</div>
</body></html>
